name: Vendor Risk Radar CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Submission Structure
        run: |
          test -f README.md
          test -f Submission.json
          test -f docs/Architecture_Diagram.png
          test -f docs/Demo_Runbook.md
          test -f evaluation/Self_Assessment.md

      - name: Success
        run: echo "Repository validation passed!"
